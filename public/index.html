<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5fd" />
  <meta name="description" content="Noodl Flashcards — fokus mengingat dengan kartu, clue, dan media terverifikasi." />
  <title>Noodl — Flashcards</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div><div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Noodl Home">
        <span class="brand-mark" aria-hidden="true">◈</span><span>Noodl<span class="brand-dot">.</span></span>
      </a>
      <span class="edition">FLASHCARDS <span class="edition-star">✦</span></span>
      <div class="top-actions"><span id="syncStatus" class="sync-status">Mode lokal</span><button id="headerChat" class="icon-btn" aria-label="Buat dengan ChatGPT" title="Buat dengan ChatGPT">✧</button></div>
    </header>
    <main id="main" tabindex="-1" aria-live="polite"></main>
    <nav class="dock" aria-label="Navigasi utama">
      <button data-nav="home" class="nav-btn active"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button data-nav="library" class="nav-btn"><span class="nav-icon">▤</span><span>Deck</span></button>
      <button data-nav="review" class="nav-btn"><span class="nav-icon">◈</span><span>Review</span></button>
      <button data-nav="settings" class="nav-btn"><span class="nav-icon">⚙</span><span>Settings</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
